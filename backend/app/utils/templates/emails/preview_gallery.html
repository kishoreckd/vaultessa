<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaultessa email studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#F5F3FB;color:#201B43;font-family:Arial,sans-serif}header{padding:28px 32px;background:#fff;border-bottom:1px solid #E9E5F4}h1{margin:0 0 8px;font-size:26px;letter-spacing:-1px}header strong{color:#4F46E5}header p{margin:0;color:#716B8B;font-size:13px}main{display:grid;grid-template-columns:230px 1fr;max-width:1120px;margin:auto}nav{padding:24px 16px}nav a{display:block;margin:0 0 4px;padding:10px 14px;border-radius:10px;color:#514968;text-decoration:none;font-size:13px}nav a:hover,nav a:focus{background:#EDEBFF;color:#4F46E5}section{padding:24px 0}iframe{width:100%;height:1100px;border:0;border-radius:20px}small{display:block;padding:12px 24px;color:#716B8B;line-height:1.6}@media(max-width:650px){main{display:block}nav{display:flex;overflow:auto;padding:12px}nav a{white-space:nowrap}header{padding:20px}section{padding:0}}@media(prefers-color-scheme:dark){body{background:{{ dark.background }};color:{{ dark.ink }}}header{background:{{ dark.card }};border-color:{{ dark.border }}}header strong{color:{{ dark.accent }}}header p,small{color:{{ dark.muted }}}nav a{color:{{ dark.muted }}}nav a:hover,nav a:focus{background:{{ dark.lavender }};color:{{ dark.accent }}}}.preview-pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px 0}.preview-pair span{grid-column:1/-1;font-size:12px;font-weight:bold;padding:4px 14px}.preview-pair a{margin:0;padding:6px 14px;font-size:12px}@media(max-width:650px){.preview-pair{min-width:170px}}</style></head><body><header><h1><strong>Vaultessa</strong> / Email studio</h1><p>Project-specific illustrations. Light and dark previews. Fictional preview data only.</p></header><main><nav>{{ links | safe }}<small>HTML templates: app/utils/templates/emails/<br>Illustrations: app/static/email/<br>Plain-text fallback is included in the email itself.</small></nav><section><iframe name="email-preview" src="verify-email.html" title="Email preview"></iframe></section></main></body></html>
