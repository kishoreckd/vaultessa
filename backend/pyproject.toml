[project]
name = "vaultessa-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"] # FastAPI's Depends()/Query() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["E501"]
"app/modules/audit/service.py" = ["S105"] # SECRET_* action names aren't passwords
"app/modules/external_shares/email.py" = ["E501"] # inline-styled HTML email markup
"app/core/email_layout.py" = ["E501"] # inline-styled HTML email markup
